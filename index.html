<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Untitled Embed Player</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: rgba(17, 24, 39, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    .page {
      width: min(100%, 760px);
    }

    .player-card {
      width: 100%;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 32px;
      background: var(--card);
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.12);
    }

    .embed-shell {
      width: 100%;
      height: 192px;
      overflow: hidden;
      border-radius: 24px;
      background: #ffffff;
    }

    .embed-shell iframe {
      display: block;
      width: 100%;
      height: 192px;
      border: 0;
      border-radius: 24px;
      background: #ffffff;
    }

    .hint {
      margin: 16px 4px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      text-align: center;
    }

    .hint a {
      color: inherit;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="player-card" aria-label="Untitled music embed player">
      <div class="embed-shell">
        <!-- [untitled] embed block -->
        <iframe
          src="https://untitled.stream/embed/663AfBuWDUkW"
          title="Untitled music player"
          width="100%"
          height="192"
          allow="autoplay; fullscreen; picture-in-picture; clipboard-write"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"
          loading="eager">
        </iframe>
      </div>
    </section>
  </main>
</body>
</html>
