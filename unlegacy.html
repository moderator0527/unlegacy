<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>연애혁명 2016</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --bg: #1b1b1b;
      --text: #ffffff;
      --line: rgba(255, 255, 255, 0.44);
      --line-hover: rgba(255, 255, 255, 0.86);
      --button-bg: rgba(0, 0, 0, 0.18);
      --button-bg-hover: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      color: var(--text);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    .page {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100dvh;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image: url('./logo_draft.webp');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      transform: none;
    }

    .page::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at center, rgba(0, 0, 0, 0.02) 0%, rgba(0, 0, 0, 0.04) 44%, rgba(0, 0, 0, 0.16) 100%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.12));
      pointer-events: none;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2.2vw, 24px);
      width: min(760px, calc(100vw - 32px));
      transform: translateY(18vh);
      padding: 0 8px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.58em;
      min-width: min(280px, 44vw);
      min-height: 58px;
      padding: 18px 28px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--button-bg);
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.015em;
      font-size: clamp(15px, 1.35vw, 19px);
      font-weight: 600;
      line-height: 1;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;
    }

    .button .kr {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    .button .en {
      font-family: "Mytupi", "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 500;
      letter-spacing: 0.01em;
      opacity: 0.9;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: var(--line-hover);
      background: var(--button-bg-hover);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.26);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.92);
      outline-offset: 5px;
    }

    @media (max-width: 640px) {
      .page::before {
        background-size: cover;
        transform: none;
      }

      .actions {
        gap: 10px;
        width: calc(100vw - 22px);
        transform: translateY(19vh);
      }

      .button {
        min-width: 0;
        flex: 1 1 0;
        min-height: 52px;
        padding: 14px 12px;
        gap: 0.42em;
        font-size: 13px;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="UNLEGACY demo landing page">
    <nav class="actions" aria-label="UNLEGACY links">
      <a
        class="button"
        href="https://buttery-raptorex-40b.notion.site/album-proposal-of-unlegacy-36e249f4585f80ee90e6dca47f63d08b"
        target="_blank"
        rel="noopener noreferrer"
        data-track="click_open_notion"
      >
        <span class="kr">기획안</span>
        <span class="en">proposal</span>
      </a>

      <a
        class="button"
        href="https://untitled.stream/library/project/PMDa2woK3a0UqN6DdR9PA"
        target="_blank"
        rel="noopener noreferrer"
        data-track="click_music"
      >
        <span class="kr">데모 듣기</span>
        <span class="en">listen to demo</span>
      </a>
    </nav>
  </main>

  <script>
    /*****************************************************************
     * MODI / UNLEGACY Supabase tracking script
     * Records anonymous visit events to Supabase table: album_events
     *****************************************************************/
    const SUPABASE_URL = 'https://nuckgnididziqlcifwke.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_4WHwghJkjjB5yN6N2WHacQ_ymWnpovu';
    const TRACKING_TABLE = 'album_events';

    const pageParams = new URLSearchParams(window.location.search);
    const DEBUG_TRACKING = pageParams.get('debug') === '1';

    const campaign = {
      to: pageParams.get('to') || pageParams.get('recipient') || 'unknown',
      source: pageParams.get('utm_source') || '',
      medium: pageParams.get('utm_medium') || '',
      campaign: pageParams.get('utm_campaign') || '',
      content: pageParams.get('utm_content') || ''
    };

    function debugLogTracking(message, data) {
      if (!DEBUG_TRACKING) return;
      console.log('[MODI Supabase tracking]', message, data || '');
    }

    function safeRandomId(prefix) {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return prefix + '_' + window.crypto.randomUUID();
      }
      return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 12);
    }

    function safeStorageGet(storage, key) {
      try {
        return storage.getItem(key);
      } catch (error) {
        return null;
      }
    }

    function safeStorageSet(storage, key, value) {
      try {
        storage.setItem(key, value);
      } catch (error) {
        // Some privacy modes block localStorage/sessionStorage.
        // Tracking still works for the current page view using in-memory IDs.
      }
    }

    function getOrCreateVisitorId() {
      const key = 'modi_unlegacy_visitor_id';
      let id = safeStorageGet(window.localStorage, key);
      if (!id) {
        id = safeRandomId('v');
        safeStorageSet(window.localStorage, key, id);
      }
      return id;
    }

    function getOrCreateSessionId() {
      const key = 'modi_unlegacy_session_id';
      let id = safeStorageGet(window.sessionStorage, key);
      if (!id) {
        id = safeRandomId('s');
        safeStorageSet(window.sessionStorage, key, id);
      }
      return id;
    }

    const visitorId = getOrCreateVisitorId();
    const sessionId = getOrCreateSessionId();
    const pageStartedAt = Date.now();

    function getDeviceInfo() {
      return {
        screen: window.screen ? `${window.screen.width}x${window.screen.height}` : '',
        viewport: `${window.innerWidth}x${window.innerHeight}`,
        language: navigator.language || '',
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
        userAgent: navigator.userAgent || ''
      };
    }

    function normalizeEventName(rawEventName) {
      const name = String(rawEventName || '').trim();

      if (name === 'page_view' || name === 'page_exit') return name;
      if (/^stay_(5|10|30|60|120|180)s$/.test(name)) return name;
      if (name.startsWith('click_open_notion')) return 'click_open_notion';
      if (name === 'click_music') return 'click_music';
      if (name.startsWith('click_')) return 'click_external';

      return name || 'click_external';
    }

    async function track(rawEventName, value = '', props = {}) {
      const normalizedEventName = normalizeEventName(rawEventName);
      const elapsedSeconds = Math.round((Date.now() - pageStartedAt) / 1000);

      const row = {
        visitor_id: visitorId,
        session_id: sessionId,
        recipient: campaign.to,
        event_name: normalizedEventName,
        event_value: String(value ?? ''),
        page: window.location.pathname,
        referrer: document.referrer || '',
        url: window.location.href,
        user_agent: navigator.userAgent || '',
        screen_width: window.screen ? window.screen.width : null,
        screen_height: window.screen ? window.screen.height : null,
        viewport_width: window.innerWidth || null,
        viewport_height: window.innerHeight || null,
        props: {
          ...campaign,
          rawEventName,
          elapsedSeconds,
          ...props
        }
      };

      debugLogTracking('send', row);

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/${TRACKING_TABLE}`, {
          method: 'POST',
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            Prefer: 'return=minimal'
          },
          body: JSON.stringify(row),
          keepalive: true
        });

        if (!response.ok) {
          const text = await response.text();
          console.error('[MODI Supabase tracking] failed', response.status, text);
        } else {
          debugLogTracking('success', { rawEventName, eventName: normalizedEventName, recipient: campaign.to });
        }
      } catch (error) {
        console.error('[MODI Supabase tracking] error', error);
      }
    }

    track('page_view', '', {
      ...getDeviceInfo(),
      title: document.title
    });

    [5, 10, 30, 60, 120, 180].forEach(seconds => {
      window.setTimeout(() => {
        track(`stay_${seconds}s`, seconds);
      }, seconds * 1000);
    });

    document.addEventListener('click', event => {
      const target = event.target.closest('[data-track]');
      if (!target) return;

      const rawEventName = target.dataset.track || 'click_external';

      track(rawEventName, '', {
        text: (target.innerText || target.textContent || '').trim().slice(0, 160),
        href: target.href || '',
        id: target.id || '',
        classes: target.className || ''
      });
    });

    let exitTracked = false;
    function trackExit(reason) {
      if (exitTracked) return;
      exitTracked = true;
      track('page_exit', Math.round((Date.now() - pageStartedAt) / 1000), { reason });
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        trackExit('visibility_hidden');
      }
    });

    window.addEventListener('pagehide', () => trackExit('pagehide'));
  </script>
</body>
</html>
